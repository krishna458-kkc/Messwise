services:
  - type: web
    name: messwise-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MESSWISE_DB_PATH
        value: data/messwise.db
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
      # To connect to Render PostgreSQL, set DATABASE_URL in the Render dashboard
      # or uncomment when defining a render managed database:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: messwise-postgres
      #     property: connectionString

# Optional: Managed PostgreSQL database on Render
# databases:
#   - name: messwise-postgres
#     databaseName: messwise
#     user: messwise
